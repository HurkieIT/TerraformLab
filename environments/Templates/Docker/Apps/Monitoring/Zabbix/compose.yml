services:
 zabbix-server:
    image: zabbix/zabbix-server-mysql:latest
    container_name: zabbix_server_monitoring
    restart: unless-stopped
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: zabbix_db
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix_password
    volumes:
      - zabbix_server_data:/var/lib/zabbix