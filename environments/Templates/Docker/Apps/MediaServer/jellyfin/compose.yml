services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.10
    container_name: jellyfin_webser
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${CACHE_ROOT}/jellyfin:/cache
      - ${MEDIA_ROOT}:/media:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - proxy

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: qbittorrent_webser
    restart: unless-stopped
    ports:
      - "8080:8080"         # WebUI
      - "6881:6881"         # TCP
      - "6881:6881/udp"     # UDP
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DOWNLOADS_ROOT}:/downloads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.26.3
    container_name: prowlarr_webser
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      qbittorrent:
        condition: service_healthy
    networks:
      - internal

  radarr:
    image: lscr.io/linuxserver/radarr:5.11.0
    container_name: radarr_webser
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DOWNLOADS_ROOT}:/downloads
      - ${MEDIA_ROOT}:/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.9
    container_name: sonarr_webser
    restart: unless-stopped
    ports:
      - "8989:8989"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DOWNLOADS_ROOT}:/downloads
      - ${MEDIA_ROOT}:/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  lidarr:
    image: lscr.io/linuxserver/lidarr:2.4.3
    container_name: lidarr_webser
    restart: unless-stopped
    ports:
      - "8686:8686"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - ${DOWNLOADS_ROOT}:/downloads
      - ${MEDIA_ROOT}:/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.4.4
    container_name: bazarr_webser
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${MEDIA_ROOT}:/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

networks:
  internal:
    name: media_internal
    driver: bridge
  proxy:
    # tijdelijke naam, hier kan later nog nginx of traefik aan toegevoegd worden
    name: proxy
    driver: bridge
